<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>elevX Network · Powered by Incluhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* elevX palette — charcoal, stone & cotton */
    --c1:#151413; --c2:#ECE8E1; --c3:#2E2925; --c4:#8A7F72; --c5:#7A7670;
    --bg:#F4F3F0; --surface:#F9F8F6; --card:#FFFFFE; --soft:#EEECE7; --soft2:#E2DED6;
    --line:#E5E2DB; --ink:var(--c1); --ink2:#474441; --muted:var(--c5);
    --espresso:var(--c1); --espresso2:#232120; --espresso3:#2F2C2A; --sideText:var(--c2); --sideMuted:#8F8B85;
    --accent:var(--c3); --accent2:var(--c4); --burgundy:#B3261E; --sage:#F0EDE7; --sageInk:var(--c3);
    --gold:#9C8F7E; --green:#4E9A5B; --red:#B3261E;
    --serif:'Cormorant Garamond', Georgia, serif; --sans:'Inter', system-ui, sans-serif;
    --r:14px; --shadow:0 1px 2px rgba(20,13,14,.04), 0 6px 24px rgba(20,13,14,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .serif{font-family:var(--serif)}
  .muted{color:var(--muted)}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#D3CBBB;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:268px 1fr;height:100vh}
  .side{background:var(--espresso);color:var(--sideText);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .side::after{content:"";position:absolute;inset:auto 0 0 0;height:280px;pointer-events:none;
    background:radial-gradient(120% 80% at 70% 100%, rgba(180,138,90,.18), transparent 60%);}
  .side-scroll{overflow-y:auto;flex:1;padding:0 14px 16px;position:relative;z-index:1}
  .side-scroll::-webkit-scrollbar-thumb{background:#2F2C2A}
  .brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
  .brand .wm{font-family:var(--serif);letter-spacing:.22em;font-size:15px;line-height:1.1;color:#EFE9DD}
  .brand .tag{font-size:8.5px;letter-spacing:.2em;color:var(--sideMuted);margin-top:4px}
  .space{margin:0 0 14px;border:1px solid #2F2C2A;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;transition:.2s}
  .space:hover{background:var(--espresso2)}
  .space .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#8A7F72,#2E2925);display:grid;place-items:center;font-family:var(--serif);font-size:18px;color:#EFE9DD}
  .space b{display:block;font-weight:500;font-size:13.5px;color:#EFE9DD}
  .space small{font-size:11px;color:var(--sideMuted)}
  .create-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#ECE8E1;color:var(--espresso);border-radius:10px;padding:10px;font-weight:500;margin-bottom:14px;transition:.2s}
  .create-btn:hover{background:#fff}
  .nav-item{display:flex;align-items:center;gap:12px;padding:8.5px 12px;border-radius:9px;color:#CFC7B8;width:100%;text-align:left;font-size:13.5px;transition:.15s;position:relative}
  .nav-item:hover{background:var(--espresso2);color:#fff}
  .nav-item.active{background:var(--espresso3);color:#fff}
  .nav-item .badge{margin-left:auto;background:#2E2925;color:#fff;font-size:10.5px;border-radius:20px;padding:1px 7px;font-weight:500}
  .nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#B3261E}
  .sec-h{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;color:var(--sideMuted);padding:18px 12px 6px;text-transform:uppercase}
  .sec-h button{color:var(--sideMuted);display:grid;place-items:center;width:20px;height:20px;border-radius:6px}
  .sec-h button:hover{background:var(--espresso3);color:#fff}
  .nav-item .hash{color:var(--sideMuted);width:18px;text-align:center;font-size:15px}
  .nav-item.unread{color:#fff;font-weight:500}
  .dm-av{position:relative}
  .dm-av .on{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#5DBB6E;border:2px solid var(--espresso)}
  .side-foot{position:relative;z-index:1;padding:14px 22px 18px;border-top:1px solid #2F2C2A;display:flex;align-items:center;justify-content:space-between}
  .side-foot .motto{font-family:var(--serif);font-size:19px;line-height:1.1;color:#EFE9DD}
  .powered{font-size:10px;letter-spacing:.14em;color:var(--sideMuted);display:flex;align-items:center;gap:6px;text-transform:uppercase}

  .main{display:flex;flex-direction:column;min-width:0;height:100vh}
  .top{height:68px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface)}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--muted)}
  .search input{border:0;outline:0;background:transparent;flex:1;font-size:13px}
  .kbd{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative;transition:.15s}
  .icon-btn:hover{background:var(--soft)}
  .icon-btn .ping{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#B3261E;border:1.5px solid var(--surface)}
  .me{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--line)}
  .me b{font-weight:500;display:block;font-size:13.5px}
  .me small{color:var(--muted);font-size:11.5px}

  .view{flex:1;overflow:hidden;display:none}
  .view.active{display:flex}
  .scroll{overflow-y:auto;flex:1;min-width:0}
  .pad{padding:28px 32px 40px}
  .rpanel{width:360px;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:24px 22px}

  /* ---------- Atoms ---------- */
  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex-shrink:0;position:relative;overflow:hidden;letter-spacing:.02em}
  .av::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 30% 20%,rgba(255,255,255,.22),transparent 60%)}
  .stack{display:flex}.stack .av{border:2px solid var(--card);margin-left:-8px}.stack .av:first-child{margin-left:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--ink2);white-space:nowrap}
  .chip.official{background:#EFE8DD;color:var(--accent)}
  .chip.green{background:#E6EFE3;color:#3F6B44}
  .chip.amber{background:#F6EAD6;color:#8A5B1E}
  .chip.blue{background:#E5EAF0;color:#3E5670}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:500;font-size:13px;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--espresso);color:#F3EEE4}.btn.primary:hover{background:var(--accent)}
  .btn.ghost{border:1px solid var(--line);background:var(--card)}.btn.ghost:hover{background:var(--soft)}
  .btn.soft{background:var(--soft);color:var(--accent)}.btn.soft:hover{background:var(--soft2)}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
  .h1{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
  .h2{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.2}
  .h3{font-size:15px;font-weight:600}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{padding:12px 0;color:var(--muted);font-size:13.5px;position:relative}
  .tab.active{color:var(--ink);font-weight:500}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
  .page-head p{color:var(--muted);margin-top:6px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff}
  .verified svg{width:9px;height:9px;stroke-width:3}

  /* ---------- Home ---------- */
  .greet{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .stat{padding:18px 20px}
  .stat .n{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1;margin:10px 0 6px}
  .stat small{color:var(--muted);font-size:12px}
  .stat .up{color:#3F7A4A;font-weight:500}
  .home-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
  .event-hero{display:grid;grid-template-columns:1fr 250px;overflow:hidden}
  .event-hero .img{background:#151413;position:relative;display:grid;place-items:center;min-height:300px}
  .event-hero .img .words{position:absolute;right:18px;top:18px;text-align:right;font-family:var(--serif);letter-spacing:.3em;font-size:11px;color:#fff;line-height:1.9;text-transform:uppercase}
  .arch{position:absolute;inset:40px 40px 0 40px;border-radius:120px 120px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06))}
  .rsvp-bar{height:34px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 12px;font-size:13px;margin-bottom:8px}
  .rsvp-bar .fill{position:absolute;inset:0 auto 0 0;background:var(--soft2);border-radius:9px}
  .rsvp-bar.win .fill{background:var(--espresso)}.rsvp-bar.win{color:#fff}
  .rsvp-bar span{position:relative;flex:1}.rsvp-bar em{position:relative;font-style:normal;font-weight:500;color:var(--ink)}
  .rsvp-bar.win em{color:var(--ink)}
  .list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:0}
  .date-box{width:46px;flex-shrink:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:5px 0;background:var(--surface)}
  .date-box b{display:block;font-family:var(--serif);font-size:20px;line-height:1;font-weight:600}
  .date-box small{font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .match{font-size:11px;font-weight:600;color:var(--sageInk);background:var(--sage);border-radius:20px;padding:2px 8px}

  /* ---------- Feed ---------- */
  .hero{border-radius:var(--r);overflow:hidden;position:relative;height:200px;margin-bottom:6px;background:#151413}
  .hero .art{position:absolute;inset:0 0 0 38%}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,#EFE9DD 0%,#EFE9DD 36%,rgba(239,233,221,.0) 62%)}
  .hero .t,.hero .w{z-index:2}
  .hero .t{position:absolute;left:38px;top:30px}
  .hero .t h1{font-family:var(--serif);font-weight:500;font-size:46px;line-height:.98;color:var(--ink)}
  .hero .t p{font-family:var(--serif);font-size:19px;margin-top:10px;color:var(--ink2)}
  .hero .w{position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:10.5px;letter-spacing:.2em;line-height:2;color:#fff;text-transform:uppercase}
  .post{padding:22px 24px;margin-bottom:16px}
  .post-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .post-head b{font-weight:500}
  .post-head small{display:block;color:var(--muted);font-size:12px}
  .post-body{display:grid;grid-template-columns:1fr 210px;gap:22px}
  .post-body h3{font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.2;margin-bottom:8px}
  .post-body p{color:var(--ink2)}
  .thumb{border-radius:10px;min-height:130px;position:relative;overflow:hidden;display:grid;place-items:center}
  .meta-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;align-items:center}
  .meta{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--surface);font-size:12.5px}
  .meta small{display:block;color:var(--muted);font-size:10.5px;line-height:1.2}
  .post-foot{display:flex;align-items:center;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
  .post-foot button{display:flex;align-items:center;gap:7px}
  .post-foot button:hover{color:var(--ink)}
  .post-foot .liked{color:var(--burgundy)}.post-foot .liked svg{fill:var(--burgundy)}
  .post-foot .r{margin-left:auto}

  .creator-row{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;align-items:flex-start}
  .creator-row .ph{width:62px;height:70px;border-radius:9px;flex-shrink:0}
  .creator-row b{font-weight:600;font-size:13.5px}
  .creator-row .loc{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:3px}
  .creator-row .loc svg{width:12px;height:12px}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tags .chip{font-size:10.5px;padding:2px 8px}
  .filter-chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}
  .fchip{border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;background:var(--card);transition:.15s}
  .fchip:hover{background:var(--soft)}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---------- Poll ---------- */
  .poll-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 10px}
  .popt{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;transition:.18s;text-align:left}
  .popt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .popt .pic{height:128px;display:grid;place-items:center;background:linear-gradient(180deg,#F3EFE8,#E4DCCD)}
  .popt .lab{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:12.5px}
  .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid #9C968C;display:grid;place-items:center;flex-shrink:0}
  .popt.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,48,36,.12)}
  .popt.sel .radio{border-color:var(--accent)}.popt.sel .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .res-row{display:grid;grid-template-columns:18px 100px 1fr 40px 28px;align-items:center;gap:10px;padding:8px 0;font-size:13px}
  .res-row .sw{width:16px;height:16px;border-radius:50%}
  .res-row .bar{height:18px;border-radius:4px;background:var(--soft);overflow:hidden}
  .res-row .bar i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .res-row .pc{font-weight:600;text-align:right}.res-row .ct{color:var(--muted);text-align:right}
  .winner{background:var(--sage);border-radius:12px;padding:16px 18px;display:flex;gap:12px;align-items:center;margin:14px 0}
  .quote{display:flex;gap:12px;padding:10px 0}
  .quote .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex-shrink:0;background:var(--card)}
  .comment{display:flex;gap:12px;padding:12px 0}
  .comment b{font-weight:500;font-size:13px}
  .comment .small{font-size:11.5px;color:var(--muted)}
  .comment-actions{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px}
  .input-row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .input{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--card)}
  .input input{border:0;outline:0;background:transparent;flex:1;font-size:13px}
  .send{width:42px;height:42px;border-radius:11px;background:var(--espresso);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .send:hover{background:var(--accent)}
  .mini-poll{padding:18px 20px;margin-bottom:14px}

  /* ---------- Chat ---------- */
  .chat{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--surface)}
  .chat-head{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--card)}
  .chat-head .t{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
  .chat-head small{color:var(--muted);font-size:12.5px}
  .msgs{flex:1;overflow-y:auto;padding:20px 28px}
  .day{display:flex;justify-content:center;margin:6px 0 16px}
  .day span{font-size:11.5px;background:var(--soft);padding:3px 12px;border-radius:20px;color:var(--ink2)}
  .msg{display:flex;gap:13px;padding:8px 10px;border-radius:10px;margin:0 -10px;transition:.1s}
  .msg:hover{background:rgba(234,226,216,.35)}
  .msg .name{font-weight:600;font-size:14px}
  .msg .time{font-size:11px;color:var(--muted);margin-left:8px;font-weight:400}
  .msg .role{font-size:10.5px;margin-left:6px}
  .msg p{color:var(--ink2);margin-top:2px}
  .reacts{display:flex;gap:6px;margin-top:7px}
  .react{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--card)}
  .react.mine{border-color:#C9C3BA;background:#EEECE7}
  .thread-link{font-size:12px;color:var(--accent);font-weight:500;margin-top:6px;display:flex;align-items:center;gap:8px}
  .attach{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card);margin-top:8px;max-width:360px}
  .pdf{width:32px;height:38px;border-radius:5px;background:#B8483A;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
  .intro-card{display:grid;grid-template-columns:130px 1fr;gap:18px;background:var(--soft);border-radius:12px;padding:14px;margin-top:10px;max-width:620px}
  .intro-card .ph{border-radius:8px;min-height:150px}
  .composer{margin:0 26px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
  .composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;padding:14px 16px 4px;font-size:13.5px;height:46px}
  .composer .tools{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
  .composer .tools .icon-btn{width:32px;height:32px;color:var(--muted)}
  .composer .send{width:36px;height:36px;margin-left:auto;border-radius:9px}
  /* DM bubbles */
  .bub-row{display:flex;gap:10px;margin:10px 0;align-items:flex-end}
  .bub-row.me{flex-direction:row-reverse}
  .bub{max-width:62%;padding:11px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
  .bub-row.me .bub{background:#EAE7E1;border-color:#ECE8E1;border-bottom-right-radius:4px}
  .bub-row:not(.me) .bub{border-bottom-left-radius:4px}
  .bub .tm{font-size:10.5px;color:var(--muted);display:block;margin-top:5px;text-align:right}
  .deal{border:1px dashed #C9C3BA;background:#F5F3EF;border-radius:12px;padding:12px 14px;margin-top:8px}
  .profile-cover{height:130px;border-radius:12px;background:#1C1214;position:relative;margin-bottom:46px}
  .profile-cover .av{position:absolute;left:18px;bottom:-40px;border:4px solid var(--surface)}
  .kv{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--ink2);font-size:13px}
  .kv svg{color:var(--muted)}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .gallery div{aspect-ratio:1;border-radius:9px}
  .lock-note{display:flex;gap:10px;background:var(--soft);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ink2);margin-top:18px}

  /* ---------- Discover ---------- */
  .disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .dcard{overflow:hidden;transition:.2s}
  .dcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(42,30,25,.1)}
  .dcard .ph{height:190px;position:relative;display:flex;align-items:flex-end;padding:12px}
  .dcard .ph .initial{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:64px;color:rgba(255,255,255,.55)}
  .dcard .ph .match{position:relative;background:rgba(255,255,255,.9)}
  .dcard .save{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--ink)}
  .dcard .save.on{color:var(--burgundy)}.dcard .save.on svg{fill:var(--burgundy)}
  .dcard .bd{padding:14px 16px 16px}
  .dcard .nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0;padding:9px 0;text-align:center}
  .dcard .nums b{display:block;font-size:14px;font-weight:600}
  .dcard .nums small{font-size:10.5px;color:var(--muted)}
  .why{font-size:12px;color:var(--ink2);background:var(--surface);border-radius:8px;padding:8px 10px;display:flex;gap:7px;margin-top:10px}
  .why svg{width:14px;height:14px;color:var(--gold);margin-top:2px}
  .ai-banner{display:flex;gap:18px;align-items:center;padding:20px 24px;margin-bottom:22px;background:linear-gradient(110deg,#F7F3EC,#ECE4D6)}
  .ai-banner .spark{width:46px;height:46px;border-radius:12px;background:var(--espresso);color:#ECE8E1;display:grid;place-items:center}

  /* ---------- Campaigns ---------- */
  .kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;overflow-x:auto}
  .col-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px;padding:0 4px}
  .col-h .ct{font-weight:400;color:var(--muted)}
  .col-h .d{width:8px;height:8px;border-radius:50%}
  .kcard{padding:16px;margin-bottom:12px}
  .kcard h4{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.2;margin:8px 0 6px}
  .progress{height:5px;background:var(--soft);border-radius:4px;overflow:hidden;margin:12px 0 6px}
  .progress i{display:block;height:100%;background:var(--accent)}

  /* ---------- Files ---------- */
  .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .file{overflow:hidden}
  .file .pv{height:130px;display:grid;place-items:center}
  .file .bd{padding:12px 14px}
  .file b{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file small{color:var(--muted);font-size:11.5px}

  /* ---------- Modal / toast ---------- */
  .overlay{position:fixed;inset:0;background:rgba(35,22,18,.38);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
  .overlay.open{display:grid}
  .modal{width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);overflow-y:auto;background:var(--card);border-radius:18px;padding:26px 28px;box-shadow:0 30px 80px rgba(35,22,18,.3);animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
  .seg button{border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);transition:.15s}
  .seg button.on{border-color:var(--accent);background:#EEECE7;color:var(--accent);font-weight:500}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);outline:0;font-size:13.5px}
  .field input:focus,.field textarea:focus{border-color:#B8AE9C;background:#fff}
  .field textarea{resize:vertical;min-height:84px}
  .aud{display:flex;gap:8px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--espresso);color:#F3EEE4;padding:12px 18px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .notif{position:absolute;top:60px;right:120px;width:360px;z-index:40;display:none;padding:8px 0}
  .notif.open{display:block;animation:pop .18s ease}
  .notif .list-item{padding:12px 18px}

  /* ---------- elevX AI ---------- */
  .ai-head{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card)}
  .ai-orb{width:48px;height:48px;border-radius:50%;background:var(--espresso);color:#ECE8E1;display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 0 6px var(--soft)}
  .ai-orb.sm{width:38px;height:38px;box-shadow:none}
  .ai-modes{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:11px;margin-left:auto}
  .ai-modes button{padding:7px 14px;border-radius:8px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .ai-modes button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(42,30,25,.08)}
  .ai-msgs{flex:1;overflow-y:auto;padding:24px 32px}
  .u-row{display:flex;justify-content:flex-end;gap:12px;margin-bottom:22px}
  .u-bub{background:var(--soft);border-radius:14px 4px 14px 14px;padding:13px 17px;max-width:520px;color:var(--ink)}
  .u-bub .tm,.a-row .tm{font-size:11px;color:var(--muted)}
  .a-row{display:flex;gap:14px;margin-bottom:22px}
  .a-row .body{flex:1;min-width:0}
  .a-text{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 16px;display:inline-block;color:var(--ink2);max-width:640px}
  .rec-sec{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 18px;margin-top:14px}
  .rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  .rec-card{display:flex;gap:16px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
  .rec-card .ph{width:118px;height:150px;border-radius:9px;flex-shrink:0;position:relative;display:grid;place-items:center;font-family:var(--serif);font-size:40px;color:rgba(255,255,255,.55)}
  .rec-card .ph .match{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);font-size:10px}
  .rec-card b{font-size:15px;font-weight:600}
  .rec-card .kv{padding:3px 0;font-size:12.5px}
  .rec-card .kv svg{width:14px;height:14px}
  .add-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);flex-shrink:0;transition:.15s}
  .add-btn:hover{background:var(--soft)}
  .add-btn.on{background:var(--espresso);color:#fff;border-color:var(--espresso)}
  .brief-item{display:flex;gap:14px;padding:12px 0}
  .brief-item .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0;color:var(--ink2)}
  .brief-item b{font-weight:600;font-size:13px;display:block}
  .brief-item span{color:var(--ink2);font-size:13px}
  .ins{background:var(--soft);border-radius:12px;padding:14px 16px}
  .ins div{display:flex;gap:10px;padding:5px 0;font-size:13px;color:var(--ink2)}
  .ins .ck{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .ins .ck svg{width:11px;height:11px;stroke-width:3}
  .trend-card{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:14px;overflow:hidden;max-width:820px}
  .trend-card .th{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .trend-card .src{margin-left:auto;font-size:10.5px;color:var(--muted);text-align:right;max-width:240px;line-height:1.4}
  .trow{display:grid;grid-template-columns:30px 1fr 92px 120px;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
  .trow .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
  .trow h5{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.2}
  .trow p{font-size:12.5px;color:var(--muted)}
  .trow .tx{height:58px;border-radius:7px}
  .trow .tag{font-family:var(--serif);font-size:14px;color:var(--accent2);line-height:1.25}
  .opps{margin:14px;border-radius:12px;background:var(--soft);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
  .opps ul{padding-left:18px;font-size:12.5px;color:var(--ink2)}
  .opps li{padding:2px 0}
  .suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 32px 10px}
  .suggest button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;background:var(--card);color:var(--ink2)}
  .suggest button:hover{background:var(--soft)}
  .suggest svg{width:14px;height:14px}
  .typing{display:inline-flex;gap:4px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .disclaimer{text-align:center;font-size:11px;color:var(--muted);padding:0 0 12px;margin-top:-10px}
  .ai-history{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .ai-history button{text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ai-history button:hover{background:var(--soft)}

  /* ---------- elevX additions ---------- */
  .side-tex{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:.85;pointer-events:none;
    -webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
  .side::after{display:none}
  .hero{height:210px}
  .hero::before{background:linear-gradient(100deg,rgba(236,232,225,.96) 0%,rgba(236,232,225,.88) 34%,rgba(236,232,225,0) 60%)}
  .hero .art{inset:0}
  .hero .t h1{font-family:var(--sans);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.02em}
  .hero .t .rule{width:34px;height:1px;background:var(--ink);margin:14px 0 10px}
  .hero .t small{font-size:10px;letter-spacing:.3em;color:var(--ink2)}
  .hero .w{color:#F4F1EC;text-align:right}
  .cap{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--serif);color:#fff;font-size:17px;line-height:1.15;text-align:left;max-width:110px}
  .cap.dark{color:#151413}
  .mood{display:grid;grid-template-columns:repeat(4,1fr) 90px;gap:8px;margin-top:14px}
  .mood div{height:84px;border-radius:8px}
  .mood .more{background:var(--soft);display:grid;place-items:center;color:var(--ink2);font-size:13px}
  .ask-ai{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:14px;padding:18px;margin-top:18px}
  .ask-ai .go{width:38px;height:38px;border-radius:9px;background:var(--espresso);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .att-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .att-tile{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;font-size:12px}
  .att-tile .tp{height:58px;position:relative;display:grid;place-items:center}
  .att-tile .tp .play{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#151413}
  .att-tile .tp .play svg{width:12px;height:12px;fill:#151413}
  .att-tile .nm{padding:7px 9px;color:var(--ink)}
  .att-tile .nm small{display:block;color:var(--muted);font-size:10.5px}
  .pstats{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .pstats b{font-size:17px;font-weight:600;display:block}
  .pstats small{color:var(--muted);font-size:11.5px}
  .steps div{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px;color:var(--ink2)}
  .steps .bx{width:18px;height:18px;border-radius:50%;border:1.5px solid #A8A39C;display:grid;place-items:center;flex-shrink:0;cursor:pointer}
  .steps .bx.on{background:var(--espresso);border-color:var(--espresso);color:#fff}
  .steps .bx svg{width:10px;height:10px;stroke-width:3}

  @media (max-width:1280px){.rpanel{width:310px}.poll-opts{grid-template-columns:repeat(3,1fr)}.rec-grid{grid-template-columns:1fr}.trow{grid-template-columns:30px 1fr 80px}.trow .tag{display:none}}
  @media (max-width:1120px){.rpanel{display:none}.home-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.pad{padding:20px 16px}.post-body,.event-hero{grid-template-columns:1fr}.me div{display:none}}
</style>
</head>
<body>
<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="side">
    <div class="side-tex" id="sideTex"></div>
    <div class="brand" style="display:block;padding:26px 24px 20px">
      <span id="logo" style="display:none"></span>
      <div class="wm" style="font-size:44px;letter-spacing:.01em;line-height:1;color:#F4F1EC">elevX</div><div class="tag" style="font-size:10px;letter-spacing:.32em;margin-top:8px">PRIVATE CREATOR NETWORK</div>
    </div>
    <div class="side-scroll">
      <button class="space"><span class="ic" style="font-size:14px">eX</span><span style="flex:1"><b>elevX Network</b><small>Creators · Team · Partners</small></span><span data-i="chev"></span></button>
      <button class="create-btn" onclick="openModal()"><span data-i="plus"></span>Create</button>
      <nav id="mainNav"></nav>
      <div class="sec-h">Community channels <button title="Add channel" onclick="toast('New channel — coming soon')"><span data-i="plus"></span></button></div>
      <nav id="chanNav"></nav>
      <div class="sec-h">Internal · team only <span data-i="lock" style="opacity:.6"></span></div>
      <nav id="intNav"></nav>
      <div class="sec-h">Direct messages <button title="New message"><span data-i="plus"></span></button></div>
      <nav id="dmNav"></nav>
    </div>
    <div class="side-foot">
      <div><div class="motto" style="font-size:26px">Made<br>to remain.</div><div style="font-size:9px;letter-spacing:.3em;color:var(--sideMuted);margin-top:10px;line-height:1.9">PEOPLE | IDEAS<br>CONTENT | IMPACT</div></div>
      <div class="powered" title="Powered by Incluhub"><span id="incluMark"></span></div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <header class="top">
      <div class="search"><span data-i="search"></span><input placeholder="Search posts, creators, campaigns — or ask elevX AI…" onkeydown="if(event.key==='Enter'&&this.value.trim()){const q=this.value;this.value='';go('ai');aiAsk(q)}" /><span class="kbd">Ctrl K</span></div>
      <div class="top-right">
        <button class="icon-btn" title="Calendar"><span data-i="cal"></span></button>
        <button class="icon-btn" title="Notifications" onclick="document.getElementById('notif').classList.toggle('open')"><span data-i="bell"></span><span class="ping"></span></button>
        <div class="me"><span class="av" style="width:40px;height:40px;background:#2E2925;font-size:14px">SS</span><div><b>Aravind</b><small>Brand Admin</small></div><span data-i="chev" class="muted"></span></div>
      </div>
      <div class="card notif" id="notif"></div>
    </header>

    <section class="view" id="v-home"></section>
    <section class="view" id="v-announcements"></section>
    <section class="view" id="v-polls"></section>
    <section class="view" id="v-campaigns"></section>
    <section class="view" id="v-discover"></section>
    <section class="view" id="v-chat"></section>
    <section class="view" id="v-files"></section>
    <section class="view" id="v-ai"></section>
  </main>
</div>

<!-- ================= CREATE MODAL ================= -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="between"><div><div class="eyebrow">elevX Network</div><div class="h2" style="margin-top:4px">Create something new</div></div><button class="icon-btn" onclick="closeModal()"><span data-i="x"></span></button></div>
    <div class="seg" id="seg"></div>
    <div id="modalBody"></div>
    <div class="between" style="margin-top:8px">
      <label class="row muted" style="font-size:12.5px"><input type="checkbox" checked> Notify members</label>
      <div class="row"><button class="btn ghost" onclick="closeModal()">Save draft</button><button class="btn primary" onclick="closeModal();toast('Published to elevX Network')">Publish <span data-i="arrow"></span></button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span data-i="check"></span><span id="toastText"></span></div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const P = {

  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  heart:'<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  comment:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  clip:'<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>',

  document.getElementById('mainNav').innerHTML = nav.map(n =>

  document.getElementById('chanNav').innerHTML = channels.map(c =>

  document.getElementById('intNav').innerHTML = internal.map(c =>

}
function isActive(){return false}
function go(view, key=null){
  current = {view, key};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('v-'+view);
  el.classList.add('active');
  const r = renderers[view]; el.innerHTML = r(key); fillIcons(el);
  renderNav();
  if(view==='chat'){ const m=el.querySelector('.msgs'); if(m) m.scrollTop=m.scrollHeight; }
  if(view==='polls') setTimeout(()=>el.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w),40);
}

      ${Object.entries(aiRecs).map(([k,list])=>`<div class="rec-sec"><div class="between"><div><b style="font-weight:600;font-size:15px">${k}</b> <span class="muted">(${list.length} recommended)</span></div><button class="row muted" style="font-size:12.5px;gap:6px" onclick="go('discover')">View more ${I('arrow')}</button></div>
        <div class="rec-grid">${list.map(recCard).join('')}</div></div>`).join('')}
      <div class="a-text" style="margin-top:14px">All three are available for your tentative dates and fit within your budget. Would you like me to shortlist more options or help you start conversations?</div>`)}`;

  const trendsConvo = `
    ${userRow('What are the current marketing trends in the everyday apparel and conscious clothing market, both globally and in India?','10:14 AM')}
    ${aiRow(`<div class="a-text">Here’s a concise overview of key marketing trends in everyday and conscious apparel, based on recent global and India-specific industry insights:</div>
      <div class="trend-card"><div class="th"><span style="color:var(--accent)">${I('spark')}</span><span class="serif" style="font-size:23px;font-weight:500">Key Trends in Everyday Apparel Marketing</span><span class="src">Sources: Business of Fashion · McKinsey State of Fashion · WGSN · Redseer · India Retailing</span></div>
        ${trends.map(([h,p,tag,bg],i)=>`<div class="trow"><span class="num">${i+1}</span><div><h5>${h}</h5><p>${p}</p></div><div class="tx" style="background:${bg}"></div><div class="tag">${tag}</div></div>`).join('')}
        <div class="opps"><div><div class="row" style="margin-bottom:8px">${I('poll')}<span class="serif" style="font-size:20px">Opportunities for elevX Network</span></div>
          <ul><li>Lead Everyday Movement with unposed, day-in-the-life creator reels.</li><li>Show the fabric up close — weave, weight and how it moves.</li><li>Run a “one piece, seven days” styling series with 5 creators across cities.</li><li>Share sourcing and care stories to back up the “conscious” promise.</li><li>Use creator storefront links on Instagram for tap-to-buy launches.</li></ul></div>
          <div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary sm" onclick="aiAsk('Generate campaign ideas from these trends')">Generate campaign ideas ${I('arrow')}</button><button class="btn ghost sm" onclick="aiAsk('Show me a competitor analysis')">Show competitor analysis</button></div></div>
      </div>`)}`;

  const briefPanel = `
    <div class="between"><div class="h3" style="font-size:18px">Current brief</div><button class="muted" style="font-size:12.5px" onclick="toast('Brief editing — coming soon')">Edit</button></div>
    <div class="card" style="padding:4px 16px;margin-top:12px;box-shadow:none">
      ${[['brief','Campaign type','Everyday Movement · Creator campaign'],['award','Budget','₹2,50,000 – ₹3,00,000'],['users','Requirements','2 Models<br>1 Videographer'],['spark','Style','Natural, Real-life, Documentary'],['pin','Preference','Hyderabad / Mumbai / Bangalore<br>Available next 2–3 weeks']].map(([i,a,b])=>`<div class="brief-item"><span class="ic">${I(i)}</span><div><b>${a}</b><span>${b}</span></div></div>`).join('')}
    </div>
    <div class="row" style="margin:22px 0 10px">${I('spark')}<div class="h3" style="font-size:16px">AI insights</div></div>
    <div class="ins">${['Selected creators have strong real-life, unposed content','All are available within your budget','Audience overlap with elevX’s 21–32 urban buyer'].map(t=>`<div><span class="ck">${I('check')}</span>${t}</div>`).join('')}</div>
    <div class="h3" style="margin:22px 0 6px">Shortlist <span class="muted" style="font-weight:400">(${shortlist.size})</span></div>
    ${shortlist.size?[...shortlist].map(n=>`<div class="list-item" style="align-items:center;padding:8px 0">${av(n,32)}<div style="flex:1"><b style="font-weight:500;font-size:13px">${n}</b></div><button class="muted" onclick="shortlist.delete('${n}');go('ai')">${I('x')}</button></div>`).join(''):'<small class="muted">Tap + on a recommendation to add it.</small>'}
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:16px;padding:12px" onclick="toast('Campaign created with ${shortlist.size} creators');go('campaigns')">Shortlist &amp; create campaign ${I('arrow')}</button>
    <div class="h3" style="margin:24px 0 2px;font-size:13px">Recent chats</div>
    <div class="ai-history">${['Everyday Movement creators','Everyday apparel trends','Gen Z audience — India','Pop-up content plan','Competitor analysis: D2C basics brands'].map((t,i)=>`<button onclick="aiMode='${i===1?'trends':'creators'}';go('ai')">${t}</button>`).join('')}</div>`;

  return `<div class="chat">
    <div class="ai-head"><span class="ai-orb">${I('spark')}</span><div><div class="h2" style="font-size:28px;line-height:1">elevX AI</div><small class="muted">Your creative partner for creators, culture and growth.</small></div>
      <div class="ai-modes"><button class="${aiMode==='creators'?'on':''}" onclick="aiMode='creators';go('ai')">${I('users')}Find creators</button><button class="${aiMode==='trends'?'on':''}" onclick="aiMode='trends';go('ai')">${I('poll')}Market insights</button></div>
      <button class="btn ghost sm" onclick="aiExtra[aiMode]=[];toast('New chat started')">${I('plus')}New chat</button></div>
    <div class="ai-msgs" id="aiMsgs">${aiMode==='creators'?creatorsConvo:trendsConvo}${extra}</div>
    <div class="suggest">${aiSuggest[aiMode].map(([i,t])=>`<button onclick="aiAsk('${t}')">${I(i)}${t}</button>`).join('')}</div>
    <div class="composer"><textarea id="aiCompose" placeholder="Ask anything… e.g. find a stylist, suggest a location, compare portfolios" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiAsk()}"></textarea>
      <div class="tools"><button class="icon-btn">${I('clip')}</button><button class="icon-btn">${I('image')}</button><span class="muted" style="font-size:11.5px;margin-left:6px">Knows your network, campaigns &amp; Incluhub talent pool</span><button class="send" onclick="aiAsk()">${I('send')}</button></div></div>
    <div class="disclaimer">elevX AI may reference external sources. Please verify critical information.</div>
  </div>
  <aside class="rpanel">${aiMode==='creators'?briefPanel:creatorPanel()}</aside>`;
};
function aiAsk(q){
  const ta = document.getElementById('aiCompose');
  const v = (q || (ta && ta.value) || '').trim(); if(!v) return;
  const t = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const mode = aiMode, list = aiExtra[mode];
  list.push({u:v.replace(/</g,'&lt;'), t}, {typing:true});
  go('ai'); const m = document.getElementById('aiMsgs'); m.scrollTop = m.scrollHeight;
  setTimeout(()=>{ list.pop(); list.push({a:aiCanned[mode]}); if(current.view==='ai' && aiMode===mode){ go('ai'); const m2=document.getElementById('aiMsgs'); m2.scrollTop=m2.scrollHeight; } }, 1300);
}

  <div class="tabs">${['All','Brand guidelines','Creative briefs','Moodboards','Contracts · internal'].map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="tabSwitch(this)">${t}</button>`).join('')}</div>

/* ============================================================
   MISC INTERACTIONS
   ============================================================ */
function tabSwitch(el){ el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
function chipToggle(el){ el.parentElement.querySelectorAll('.fchip').forEach(t=>t.classList.remove('on')); el.classList.add('on'); }
let tt; function toast(t){ const el=document.getElementById('toast'); document.getElementById('toastText').textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

const modalTypes = {
  Announcement:{ic:'mega', body:`<div class="field"><label>Title</label><input placeholder="e.g. Our Design Philosophy"></div><div class="field"><label>Message</label><textarea placeholder="Share an update with your creators…"></textarea></div><div class="field"><label>Cover image</label><div class="input" style="justify-content:center;border-style:dashed;padding:18px;color:var(--muted)">${I('image')} Drop an image or browse</div></div>`},
  Poll:{ic:'poll', body:`<div class="field"><label>Question</label><input value="Which colourway should lead the Everyday Overshirt?"></div><div class="field"><label>Options</label>${['Stone Grey','Off-White','Washed Black'].map(o=>`<div class="input" style="margin-bottom:8px">${I('image')}<input value="${o}"></div>`).join('')}<button class="btn ghost sm">${I('plus')}Add option</button></div><div class="row" style="gap:16px;font-size:12.5px"><label class="row"><input type="checkbox"> Multiple answers</label><label class="row"><input type="checkbox" checked> Show AI insights</label><label class="row">Closes in <select class="btn ghost sm"><option>3 days</option><option>1 week</option></select></label></div>`},
  Opportunity:{ic:'brief', body:`<div class="field"><label>Role</label><input placeholder="e.g. UGC creator for day-in-the-life reels"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Location</label><input value="Pan India"></div><div class="field"><label>Budget</label><input placeholder="₹ 80,000 – 1,20,000"></div></div><div class="field"><label>Brief</label><textarea placeholder="Describe the deliverables…"></textarea></div><label class="row" style="font-size:12.5px"><input type="checkbox" checked> Also ask Incluhub to suggest matching creators</label>`},
  Event:{ic:'event', body:`<div class="field"><label>Event name</label><input value="elevX Studio Pop-up"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Date & time</label><input value="24 Oct 2026, 11:00 AM"></div><div class="field"><label>Venue</label><input value="elevX Studio, Hyderabad"></div></div><div class="field"><label>RSVP deadline</label><input value="20 Oct 2026"></div>`},
};
function openModal(type='Announcement'){
  document.getElementById('seg').innerHTML = Object.entries(modalTypes).map(([k,v])=>`<button class="${k===type?'on':''}" onclick="openModal('${k}')">${I(v.ic)}${k}</button>`).join('');
  document.getElementById('modalBody').innerHTML = modalTypes[type].body + `<div class="field" style="margin-top:14px"><label>Audience</label><div class="aud"><button class="fchip on">All creators (312)</button><button class="fchip">UGC creators</button><button class="fchip">Pop-up guests</button><button class="fchip">${I('lock')} Internal team</button></div></div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

document.getElementById('notif').innerHTML = `<div class="between" style="padding:6px 18px 8px"><b style="font-weight:600">Notifications</b><button class="muted" style="font-size:12px">Mark all read</button></div>` +
  [['Rohan Mehta','accepted your offer · ₹1,50,000','12m'],['Incluhub','found 8 new creators for Everyday Movement','1h'],['Aisha Khan','replied in #brand-updates','2h'],['Nisha Gupta','mentioned you in #internal-team','3h']]
  .map(([n,t,w])=>`<div class="list-item">${n==='Incluhub'?`<span class="av" style="width:34px;height:34px;background:var(--espresso)">${I('spark')}</span>`:av(n,34)}<div style="flex:1;font-size:13px"><b style="font-weight:500">${n}</b> <span class="muted">${t}</span></div><small class="muted">${w}</small></div>`).join('');
document.addEventListener('click', e=>{ const n=document.getElementById('notif'); if(!e.target.closest('#notif') && !e.target.closest('[title=Notifications]')) n.classList.remove('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); if(e.ctrlKey && e.key==='k'){ e.preventDefault(); document.querySelector('.search input').focus(); }});

fillIcons();
go('home');
